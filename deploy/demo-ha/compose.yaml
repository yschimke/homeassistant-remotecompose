name: public-demo-ha
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.3
    restart: unless-stopped
    volumes:
      - ha_config:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
      - ./dashboard.json:/config/ui-lovelace.yaml:ro
    networks: [private]
    # No host ports, host networking, devices or Docker socket.
    mem_limit: 768m
    cpus: 1.0
    logging: &logging
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  gateway:
    build: .
    restart: unless-stopped
    environment:
      HA_URL: http://homeassistant:8123
    secrets: [ha_token]
    networks:
      private: {}
      edge:
        aliases: [demo-ha-gateway]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 3
  verify:
    build: .
    profiles: [verify]
    networks: [edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Public client on the same isolated network as Caddy; no HA token or private network.
    command: [python, verify_public.py, http://demo-ha-gateway:8080, --wait-ready, "120", --stream]
    logging: *logging
  bootstrap:
    build: .
    profiles: [setup]
    user: "0:0"
    environment:
      HA_URL: http://homeassistant:8123
    volumes: ["./private:/private"]
    networks: [private]
    command: [python, bootstrap.py]
    logging: *logging
networks:
  private:
    internal: true
  edge:
    internal: true
volumes:
  ha_config:
secrets:
  ha_token:
    file: ./private/ha_token
