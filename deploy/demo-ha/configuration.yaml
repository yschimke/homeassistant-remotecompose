# Dedicated, generic simulation. No default_config, discovery, cloud, real devices or recorder.
homeassistant:
  name: Demo Home
  latitude: 0
  longitude: 0
  elevation: 0
  unit_system: metric
  time_zone: UTC
http:
api:
websocket_api:
frontend:
onboarding:
logger:
  default: warning
lovelace:
  mode: yaml

# Private state holders give a fresh installation deterministic off states.
# The gateway never exposes these helpers or their services.
input_boolean:
  demo_heating_state:
    initial: false
  demo_lamp_state:
    initial: false
  demo_coffee_state:
    initial: false

template:
  # One HA-managed trigger, independent of visitor count. No spawned jobs or catch-up.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        seconds: "/30"
    sensor:
      - name: Demo temperature
        unique_id: demo_temperature
        device_class: temperature
        unit_of_measurement: "°C"
        state: >-
          {% set previous = this.state | float(21.5) %}
          {% set target = state_attr('climate.demo_thermostat', 'temperature') | float(22) %}
          {% set heating = is_state('input_boolean.demo_heating_state', 'on') %}
          {% set goal = target if heating else 20 %}
          {% set drift = 0.1 if previous < goal else -0.1 if previous > goal else 0 %}
          {% set noise = [-0.1, 0, 0, 0.1] | random %}
          {{ ([16, ([28, previous + drift + noise] | min)] | max) | round(1) }}
      - name: Demo humidity
        unique_id: demo_humidity
        device_class: humidity
        unit_of_measurement: "%"
        state: >-
          {{ [38, ([55, (this.state | float(45)) + ([-1, 0, 1] | random)] | min)] | max }}
      - name: Demo power
        unique_id: demo_power
        device_class: power
        unit_of_measurement: "W"
        state: >-
          {% set lamp = 12 if is_state('light.demo_lamp', 'on') else 0 %}
          {% set coffee = 850 if is_state('switch.demo_coffee', 'on') else 0 %}
          {% set heater = 600 if is_state('input_boolean.demo_heating_state', 'on') else 0 %}
          {{ 160 + lamp + coffee + heater + ([-20, -10, 0, 10, 20] | random) }}
      - name: Demo solar
        unique_id: demo_solar
        device_class: power
        unit_of_measurement: "W"
        state: >-
          {{ [600, ([2400, (this.state | float(1400)) + ([-80, -40, 0, 40, 80] | random)] | min)] | max }}
      - name: Demo battery
        unique_id: demo_battery
        device_class: battery
        unit_of_measurement: "%"
        state: >-
          {% set previous = this.state | float(78) %}
          {% set balance = (states('sensor.demo_solar') | float(1400)) - (states('sensor.demo_power') | float(160)) %}
          {% set drift = 0.1 if balance > 0 else -0.1 %}
          {{ ([45, ([95, previous + drift] | min)] | max) | round(1) }}
    binary_sensor:
      - name: Demo motion
        unique_id: demo_motion
        device_class: motion
        state: >-
          {% if now().minute % 2 == 0 and now().second == 0 %}
            {{ [true, false] | random }}
          {% else %}
            {{ this.state == 'on' }}
          {% endif %}
  - light:
      - name: Demo lamp
        unique_id: demo_lamp
        state: "{{ is_state('input_boolean.demo_lamp_state', 'on') }}"
        optimistic: true
        turn_on:
          - action: input_boolean.turn_on
            target: {entity_id: input_boolean.demo_lamp_state}
        turn_off:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.demo_lamp_state}
  - switch:
      - name: Demo coffee
        unique_id: demo_coffee
        state: "{{ is_state('input_boolean.demo_coffee_state', 'on') }}"
        optimistic: true
        turn_on:
          - action: input_boolean.turn_on
            target: {entity_id: input_boolean.demo_coffee_state}
        turn_off:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.demo_coffee_state}

# A real HA thermostat drives a private simulated heater, never physical hardware.
climate:
  - platform: generic_thermostat
    name: Demo thermostat
    unique_id: demo_thermostat
    heater: input_boolean.demo_heating_state
    target_sensor: sensor.demo_temperature
    min_temp: 16
    max_temp: 28
    target_temp: 22
    initial_hvac_mode: "heat"
    precision: 0.5
