# Dedicated, generic simulation. No default_config, discovery, cloud, real devices or recorder.
homeassistant:
  name: Demo Home
  latitude: 0
  longitude: 0
  elevation: 0
  unit_system: metric
  time_zone: UTC
http:
api:
websocket_api:
frontend:
onboarding:
logger:
  default: warning
lovelace:
  mode: yaml

# Private state holders give a fresh installation deterministic off states.
# The gateway never exposes these helpers or their services.
input_boolean:
  demo_heating_state:
    initial: false
  demo_lamp_state:
    initial: false
  demo_coffee_state:
    initial: false

template:
  - sensor:
      - name: Demo temperature
        unique_id: demo_temperature
        device_class: temperature
        unit_of_measurement: "°C"
        state: "{{ (21 + (now().minute % 10) / 10) | round(1) }}"
      - name: Demo humidity
        unique_id: demo_humidity
        device_class: humidity
        unit_of_measurement: "%"
        state: "{{ 42 + now().minute % 8 }}"
      - name: Demo power
        unique_id: demo_power
        device_class: power
        unit_of_measurement: "W"
        state: "{{ 650 + (now().minute % 12) * 75 }}"
      - name: Demo solar
        unique_id: demo_solar
        device_class: power
        unit_of_measurement: "W"
        state: "{{ 1400 + (now().minute % 10) * 180 }}"
      - name: Demo battery
        unique_id: demo_battery
        device_class: battery
        unit_of_measurement: "%"
        state: "78"
  - binary_sensor:
      - name: Demo motion
        unique_id: demo_motion
        device_class: motion
        state: "{{ now().minute % 2 == 0 }}"
  - light:
      - name: Demo lamp
        unique_id: demo_lamp
        state: "{{ is_state('input_boolean.demo_lamp_state', 'on') }}"
        optimistic: true
        turn_on:
          - action: input_boolean.turn_on
            target: {entity_id: input_boolean.demo_lamp_state}
        turn_off:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.demo_lamp_state}
  - switch:
      - name: Demo coffee
        unique_id: demo_coffee
        state: "{{ is_state('input_boolean.demo_coffee_state', 'on') }}"
        optimistic: true
        turn_on:
          - action: input_boolean.turn_on
            target: {entity_id: input_boolean.demo_coffee_state}
        turn_off:
          - action: input_boolean.turn_off
            target: {entity_id: input_boolean.demo_coffee_state}

# A real HA thermostat drives a private simulated heater, never physical hardware.
climate:
  - platform: generic_thermostat
    name: Demo thermostat
    unique_id: demo_thermostat
    heater: input_boolean.demo_heating_state
    target_sensor: sensor.demo_temperature
    min_temp: 16
    max_temp: 28
    target_temp: 22
    initial_hvac_mode: "heat"
    precision: 0.5
