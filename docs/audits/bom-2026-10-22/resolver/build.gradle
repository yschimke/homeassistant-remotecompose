import groovy.json.JsonSlurper
import groovy.json.JsonOutput
plugins { id 'org.jetbrains.kotlin.multiplatform' version '2.4.21'; id 'org.jetbrains.compose' version '1.13.0-alpha02'; id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21' }
kotlin { jvm() }
repositories {
 google { content { includeGroupByRegex('androidx.*'); includeGroupByRegex('com\\.google.*'); includeGroupByRegex('com\\.android.*') } }
 mavenCentral()
 maven { url = uri("https://repo.gradle.org/gradle/libs-releases"); content { includeGroup("org.gradle") } }
}
def specs = new JsonSlurper().parse(file('specs.json'))
specs.each { spec ->
 def c = configurations.create(spec.name) {
  canBeResolved = true; canBeConsumed = false
  attributes {
   attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, spec.usage ?: 'java-runtime'))
   attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, 'library'))
   attribute(org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE, objects.named(org.gradle.api.attributes.java.TargetJvmEnvironment, spec.target == 'androidJvm' ? 'android' : spec.target in ['wasm','native'] ? 'non-jvm' : 'standard-jvm'))
   attribute(org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType.attribute, org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType.valueOf(spec.target ?: 'jvm'))
   if (spec.target == 'wasm') attribute(Attribute.of('org.jetbrains.kotlin.wasm.target', String), 'js')
   if (spec.nativeTarget) attribute(Attribute.of('org.jetbrains.kotlin.native.target', String), spec.nativeTarget)
   if (spec.target == 'androidJvm') attribute(Attribute.of('com.android.build.api.attributes.BuildTypeAttr', String), 'release')
  }
 }
 spec.platforms.each { dependencies.add(c.name, dependencies.platform(it)) }
 spec.modules.each { coord -> dependencies.add(c.name, coord) { transitive = spec.transitive != false } }
}
tasks.register('audit') {
 doLast {
  def output = []
  specs.each { spec ->
   def c = configurations.getByName(spec.name)
   def components = c.incoming.resolutionResult.allComponents.collect { component ->
    [id:component.id.displayName, reasons:component.selectionReason.descriptions.collect { it.description }]
   }
   def failures = c.incoming.resolutionResult.allDependencies.findAll { it instanceof UnresolvedDependencyResult }.collect { [requested:it.requested.displayName, failure:it.failure.toString(), causes:it.failure.causes.collect { it.toString() }] }.unique()
   output.add([name:spec.name,components:components,failures:failures])
   println('AUDIT ' + spec.name + ' components=' + components.size() + ' failures=' + failures.size())
   failures.take(3).each { println(it) }
  }
  file('results.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(output))
  if (output.any { !it.failures.isEmpty() }) throw new GradleException('Unresolved audit dependencies; see results.json')
 }
}
