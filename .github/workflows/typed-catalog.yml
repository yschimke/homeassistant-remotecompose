name: Typed component catalog

on:
  pull_request:
    branches: [main]
    paths:
      - 'ui-builder-catalog/**'
      - 'ui-builder-catalog-consumer/**'
      - 'ui-builder-catalog-host/**'
      - 'scripts/validate-typed-catalog.sh'
      - 'scripts/publish-typed-catalog.sh'
      - '.github/workflows/typed-catalog.yml'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'rc-components-ui/**'
      - 'rc-components/**'
      - 'rc-converter/**'
  push:
    branches: [main]
    paths:
      - 'ui-builder-catalog/**'
      - 'ui-builder-catalog-consumer/**'
      - 'ui-builder-catalog-host/**'
      - 'scripts/validate-typed-catalog.sh'
      - 'scripts/publish-typed-catalog.sh'
      - '.github/workflows/typed-catalog.yml'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'rc-components-ui/**'
      - 'rc-components/**'
      - 'rc-converter/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  catalog:
    # Skip on release-please PRs: they only bump the manifest, CHANGELOG and
    # version lines, all of which main's push CI already built. Matches the
    # bot-authored PR (or a bot dispatch); humans and main always run it.
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: homeassistant-remotecompose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: homeassistant-remotecompose
          persist-credentials: false
      # The SDK is source-only; the discovery source pin carries #5935 until tools 2.56.1 ships.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: 4f6e22594ac77f753b37c1dd24377b3ba1c203e6 # JVM-default codec fix (#5935)
          path: compose-ai-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ui-builder
          ref: v3.111.0
          path: compose-ui-builder
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Install Android platform used by the app
        uses: ./homeassistant-remotecompose/.github/actions/android-sdk
      - name: Generate, render and validate in a separate catalog consumer
        run: scripts/validate-typed-catalog.sh "$GITHUB_WORKSPACE/compose-ai-tools" "$GITHUB_WORKSPACE/compose-ui-builder"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homeassistant-remotecompose-typed-catalog
          path: |
            homeassistant-remotecompose/ui-builder-catalog-consumer/build/test-results
            homeassistant-remotecompose/ui-builder-catalog/build/catalog
            homeassistant-remotecompose/ui-builder-catalog/build/renders
            homeassistant-remotecompose/ui-builder-catalog/build/test-results
            homeassistant-remotecompose/ui-builder-catalog/build/distributions
            homeassistant-remotecompose/ui-builder-catalog-host/build/renders
            homeassistant-remotecompose/ui-builder-catalog-host/build/test-results
            compose-ui-builder/ui-builder-runtime/build/test-results/test
          if-no-files-found: warn
