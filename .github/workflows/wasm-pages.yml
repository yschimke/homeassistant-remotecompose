name: Wasm website

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app-ui/**'
      - 'ha-client/**'
      - 'ha-model/**'
      - 'rc-player-ui/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'docs/**'
      - 'scripts/test-wasm-browser.py'
      - 'scripts/test-wasmo-browser.cjs'
      - 'scripts/wasmo-sim.py'
      - 'scripts/browser-tests/**'
      - 'scripts/test-demo-browser.py'
      - 'scripts/test-adaptive-dashboard-browser.py'
      - 'scripts/test-printing-dashboard-browser.py'
      - 'scripts/fixtures/printing/**'
      - 'scripts/fixtures/demo/**'
      - 'scripts/stage-wasm-demo.py'
      # Read by the browser tests: the hosted-panel test loads the HA panel
      # script and the demo test serves the demo dashboard.
      - 'custom_components/terrazzo/frontend/terrazzo-panel.js'
      - 'deploy/demo-ha/dashboard.json'
      - 'kotlin-js-store/**'
      - '.github/workflows/wasm-pages.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Wasm website
    runs-on: ubuntu-26.04  # Playwright has no Chromium for ubuntu-26.04 (ubuntu-latest)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - uses: ./.github/actions/buildfetch-cache
        with:
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Test backend capability detection
        run: node --test app-ui/test/*.test.mjs
      - name: Build production Wasm
        run: ./gradlew :app-ui:wasmJsBrowserDistribution :ha-client:jvmTest :app-ui:jvmTest :rc-player-ui:jvmTest --stacktrace
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.62.0 pillow==12.3.0
          python -m playwright install --with-deps chromium
      - name: Test browser flows at the GitHub Pages project path
        run: python scripts/test-wasm-browser.py app-ui/build/dist/wasmJs/productionExecutable
      - name: Test Wasmo cloud settings and static storage
        run: |
          npm ci --prefix scripts/browser-tests --ignore-scripts
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node scripts/test-wasmo-browser.cjs app-ui/build/dist/wasmJs/productionExecutable
      - name: Test adaptive sections and MeshCore conversation cards
        run: python scripts/test-adaptive-dashboard-browser.py app-ui/build/dist/wasmJs/productionExecutable
      - name: Test printing cards, live pictures and scroll reuse
        run: python scripts/test-printing-dashboard-browser.py app-ui/build/dist/wasmJs/productionExecutable
      - name: Test the public demo
        run: python scripts/test-demo-browser.py app-ui/build/dist/wasmJs/productionExecutable
      - name: Build existing documentation and authentication pages
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./docs
          destination: ./_site-docs
      - name: Stage Wasm app alongside existing pages
        run: |
          # Jekyll's Docker action creates root-owned output. Copy it into a runner-owned site.
          mkdir -p _site
          cp -R _site-docs/. _site/
          cp -R app-ui/build/dist/wasmJs/productionExecutable/. _site/
          python scripts/stage-wasm-demo.py _site
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wasm-browser-evidence
          path: _wasm-test/
          if-no-files-found: ignore

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
      - name: Verify published website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --retry 6 --retry-all-errors --retry-delay 5 --fail --silent --show-error "${SITE_URL}terrazzo.js" -o /dev/null
          curl --retry 6 --retry-all-errors --retry-delay 5 --fail --silent --show-error "${SITE_URL}terrazzo-auth/index.html" | grep -F 'rcha://auth-callback'
