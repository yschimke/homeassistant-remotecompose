name: Configure Wasm Pages publication
on:
  workflow_dispatch:
permissions:
  pages: write
jobs:
  configure:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Switch existing Pages site to Actions publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" = workflow
