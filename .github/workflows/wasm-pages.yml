name: Wasm website

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app-ui/**'
      - 'ha-client/**'
      - 'ha-model/**'
      - 'rc-player-ui/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'docs/**'
      - 'scripts/test-wasm-browser.py'
      - '.github/workflows/wasm-pages.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Wasm website
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - name: Build production Wasm
        run: ./gradlew :app-ui:wasmJsBrowserDistribution :ha-client:jvmTest :app-ui:jvmTest --stacktrace
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test browser flows at the GitHub Pages project path
        run: python scripts/test-wasm-browser.py app-ui/build/dist/wasmJs/productionExecutable
      - name: Build existing documentation and authentication pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site-docs
      - name: Stage Wasm app alongside existing pages
        run: |
          # Jekyll's Docker action creates root-owned output. Copy it into a runner-owned site.
          mkdir -p _site
          cp -R _site-docs/. _site/
          cp -R app-ui/build/dist/wasmJs/productionExecutable/. _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wasm-browser-evidence
          path: _wasm-test/
          if-no-files-found: ignore

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --retry 6 --retry-all-errors --retry-delay 5 --fail --silent --show-error "${SITE_URL}terrazzo.js" -o /dev/null
          curl --retry 6 --retry-all-errors --retry-delay 5 --fail --silent --show-error "${SITE_URL}terrazzo-auth/index.html" | grep -F 'rcha://auth-callback'
