name: Release Please

# Maintains a release PR from conventional-commit history. When merged,
# release-please cuts the tag + GitHub Release, then this workflow calls
# release-build.yml via workflow_call to build and publish artifacts.
# This bypasses the GITHUB_TOKEN recursion guard that otherwise prevents
# tag-push events from triggering downstream workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      publish_home_assistant: true
    secrets: inherit
    permissions:
      contents: write
      packages: write

  release-pr-policy:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Run required policy checks on the current release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --state open --limit 100 --json number,headRefName --jq '[.[] | select(.headRefName | startswith("release-please--branches--")) | select(.headRefName | endswith("--release-notes") | not)][0] // empty')"
          if [ -z "$pr" ]; then
            echo "no open release PR; nothing to dispatch"
            exit 0
          fi
          number="$(jq -r .number <<<"$pr")"
          branch="$(jq -r .headRefName <<<"$pr")"
          gh workflow run pr-title.yml --ref "$branch" -f pr="$number"
          gh workflow run no-ai-coauthors.yml --ref "$branch" -f pr="$number"
