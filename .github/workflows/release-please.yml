name: Release Please

# Maintains a release PR from conventional-commit history. When merged,
# release-please cuts the tag and a draft GitHub Release, then this workflow
# calls release-build.yml via workflow_call to build and attach artifacts;
# release-build.yml publishes the draft once every asset is attached.
# This bypasses the GITHUB_TOKEN recursion guard that otherwise prevents
# tag-push events from triggering downstream workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  preview-release-diff:
    # Compare every preview with the previous release, add it to the release notes, and audit
    # what changed (preview-release-diff.yml). Called here because a release created with
    # GITHUB_TOKEN raises no `release` event for a workflow to trigger on.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/preview-release-diff.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      publish_home_assistant: true
    secrets: inherit
    permissions:
      contents: write
      packages: write
      # The push relay deploy signs in to Google Cloud keylessly.
      id-token: write

  release-pr-policy:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Run required policy checks on the current release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --state open --limit 100 --json number,headRefName --jq '[.[] | select(.headRefName | startswith("release-please--branches--")) | select(.headRefName | endswith("--release-notes") | not)][0] // empty')"
          if [ -z "$pr" ]; then
            echo "no open release PR; nothing to dispatch"
            exit 0
          fi
          number="$(jq -r .number <<<"$pr")"
          branch="$(jq -r .headRefName <<<"$pr")"
          gh workflow run pr-title.yml --ref "$branch" -f pr="$number"
          gh workflow run no-ai-coauthors.yml --ref "$branch" -f pr="$number"

  # Which Maven coordinates merging the release PR would publish, as one comment on that PR. The
  # publish plan otherwise runs only inside the release, so the answer was visible only after the
  # upload. Same script, same Maven Central baseline, run against the release PR's head; see
  # `.github/scripts/release-pr-publish-plan.sh` (shared with compose-ui-builder, compose-ai-tools
  # and rc-players). Skipped on the run that cuts a release. Informational: it never fails.
  release-pr-publish-plan:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result == 'success' && needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # create/edit the comment on the release PR
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comment the publish plan on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RP_PR: ${{ needs.release-please.outputs.pr }}
        run: ./.github/scripts/release-pr-publish-plan.sh
