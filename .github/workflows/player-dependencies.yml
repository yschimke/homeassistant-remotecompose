name: Player dependencies

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: ./gradlew -p scripts/player-dependency-check check
