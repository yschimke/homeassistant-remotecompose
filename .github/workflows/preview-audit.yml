name: Preview Audit

# An advisory design-guidelines audit of the previews a pull request (or a release) changed.
# compose-ai-tools' reusable workflow (preview-audit-reusable.yml) does the work. It checks the
# changed previews against this repository's guideline packs with Jev and a vision recheck, or
# with a coding agent, and posts the findings as a sticky comment or appends them to the
# release notes. Findings are advisory model output, never a merge gate.
#
# Start it by commenting `/audit` on a PR (repository owner only; anything after `/audit` is a
# focus for the agent), from Actions -> Preview Audit -> Run workflow with a PR number, or in
# release mode from preview-release-diff.yml.
#
# Repository variables (all optional):
#   PREVIEW_AUDIT_AGENT           auto (Jev, then OpenCode, Claude subscription, Claude API,
#                                 Codex), jev, opencode, claude, claude-api, codex or off
#   PREVIEW_AUDIT_RECHECK_MODEL   jev's recheck model (default xiaomi/mimo-v2.6-flash; none = off)
#   PREVIEW_AUDIT_OPENCODE_MODEL, PREVIEW_AUDIT_CLAUDE_MODEL, PREVIEW_AUDIT_CODEX_MODEL
#
# What the audit reads stays here: .github/preview-audit/ (PROMPT.md for the coding agents,
# the pinned guideline packs, and jev.json, which says which guidelines file covers which module).

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to audit
        required: true
  workflow_call:
    inputs:
      release:
        description: Release tag whose preview changes to audit
        required: true
        type: string
      base:
        description: The tag the release was compared with
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  audit:
    # Every PR comment starts this workflow; this keeps all but the owner's `/audit` from
    # doing anything (the reusable workflow checks again, and refuses fork PRs).
    if: >-
      inputs.release != '' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       github.event.comment.user.login == github.repository_owner &&
       (github.event.comment.body == '/audit' || startsWith(github.event.comment.body, '/audit ')))
    uses: yschimke/compose-ai-tools/.github/workflows/preview-audit-reusable.yml@v2.86.0
    with:
      pr: ${{ inputs.pr }}
      release: ${{ inputs.release }}
      base: ${{ inputs.base }}
      agent: ${{ vars.PREVIEW_AUDIT_AGENT }}
      recheck-model: ${{ vars.PREVIEW_AUDIT_RECHECK_MODEL }}
      opencode-model: ${{ vars.PREVIEW_AUDIT_OPENCODE_MODEL }}
      claude-model: ${{ vars.PREVIEW_AUDIT_CLAUDE_MODEL }}
      codex-model: ${{ vars.PREVIEW_AUDIT_CODEX_MODEL }}
      catalog-key: compose-preview-plugin
      setup: local
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
