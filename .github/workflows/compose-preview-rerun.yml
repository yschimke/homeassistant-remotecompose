name: Compose Preview Rerun

on:
  issue_comment:
    types: [edited]

permissions: {}

concurrency:
  group: compose-preview-rerun-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      ${{
        github.event.issue.pull_request != null &&
        github.event.comment.user.type == 'Bot' &&
        startsWith(github.event.comment.body, '<!-- preview-diff -->') &&
        (
          contains(github.event.comment.body, '- [x] Re-run preview diff') ||
          contains(github.event.comment.body, '- [x] Run Compose Preview on this PR') ||
          contains(github.event.comment.body, '- [x] Re-run Compose Preview')
        )
      }}
    permissions:
      actions: write
      issues: write
      pull-requests: read
    uses: yschimke/compose-ai-tools/.github/workflows/compose-preview-rerun-reusable.yml@2f91b8e3b158d70919e9926ce46f26fd348c1319
