name: Adaptive UID parity comment

# Sticky PR comment for the UID parity run: exact captures against main, the
# captures whose reference or candidate changed, and reference / diff / candidate
# thumbnails. Runs default-branch code only; the PR's artifacts are read as data.
# Must land on the default branch before workflow_run can trigger it for PRs.
on:
  workflow_run:
    workflows: [Adaptive UID pilot]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

# Contract: https://github.com/yschimke/design-parity/blob/main/docs/UID_PARITY_CI.md#pr-comment
jobs:
  comment:
    uses: yschimke/design-parity/.github/workflows/uid-parity-comment-reusable.yml@2012e64078f64bcb2b717677f4f2d95f5a370315
    with:
      artifact-prefix: adaptive-uid
      # main's evidence comes from the pilot call inside Design Artifacts.
      base-workflow: design-artifacts.yml
