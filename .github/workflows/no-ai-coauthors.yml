name: No AI agents

# Hard gate against AI-agent *identity* leaking into the permanent git history.
#
# Scope (deliberately narrow): we reject only the things that make the history
# claim an agent authored the work —
#   1. a commit whose author or committer identity is an agent — an agent email
#      domain (@anthropic.com / @openai.com / …), or an agent *name* set
#      literally as the identity (Claude, Codex, …). GitHub App bot accounts
#      (…[bot], e.g. claude[bot]) are exempt from this one.
#   2. a `Co-authored-by:` trailer naming an agent or using an agent email.
# Links to an agent session (e.g. claude.ai/code) and the "🤖 Generated with …"
# / "_Generated by [Claude Code]_" PR/commit footers are FINE and intentionally
# not matched, as are ordinary PR comments.
#
# Why the PR layer and not just the local .githooks: PRs are squash-merged, and
# GitHub builds the squash commit *message* from the PR title + PR body, NOT the
# branch commit messages. A `Co-authored-by:` trailer in the PR description
# therefore becomes a real trailer on the default branch, bypassing every local
# hook. There is a second path too: GitHub's squash credits every distinct
# branch **commit author** as a co-author, so a branch commit authored by an
# agent lands `Co-authored-by: Claude <noreply@anthropic.com>` even when the PR
# title and body are clean. Both are covered below.
#
# Untrusted text (title/body) is passed through env: and never interpolated
# into the shell.
#
# Two layers, because a check that only *warns* is not a gate:
#   • `co-authors` runs on the PR and is meant to BLOCK the merge. Make it a
#     required status check on the branch ruleset — without that, a red run is
#     merely advisory and can be merged straight past.
#   • `drift` runs on every push to the default branch and fails loudly if
#     attribution got in anyway — via an unblocked merge, an admin override, or
#     a direct push. It cannot prevent the commit, but it makes the breach
#     visible instead of silent, and dates it to a single push.
#
# Detection lives in .github/scripts/agent-attribution-scan.sh, shared with the
# local .githooks/commit-msg and .githooks/pre-push hooks so all four callers
# agree.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-name:
    name: Reject AI agent branch names
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check head branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Lowercase before matching so "Claude/foo" / "COPILOT/bar" can't
          # slip past the prefix rejection via capitalisation.
          head_ref_lc="${HEAD_REF,,}"
          if [[ "$head_ref_lc" =~ ^(claude|copilot|cursor|devin|codex|aider|jules|gemini)/ ]]; then
            echo "::error::Branch '$HEAD_REF' uses an AI agent prefix. Rename to 'agent/...' before opening the PR."
            exit 1
          fi
          echo "Branch name OK: $HEAD_REF"

  co-authors:
    name: Scan commits and PR body
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for AI agent attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail

          git fetch --no-tags --prune origin "+$BASE_SHA" "+$HEAD_SHA" || true

          # The squash commit is built from the PR title + body, so they are
          # scanned alongside the commit messages. Untrusted — written to a file
          # rather than interpolated into the shell.
          { printf '%s\n' "${PR_TITLE:-}"; printf '%s\n' "${PR_BODY:-}"; } > pr_text.txt

          .github/scripts/agent-attribution-scan.sh \
            --range "${BASE_SHA}..${HEAD_SHA}" --text-file pr_text.txt
          status=$?
          # 2 means the scan could not run (unresolvable revision). That is not
          # "clean" and it is not "found" either — say so, rather than printing
          # the attribution message for what is actually a broken checkout.
          if [ "$status" -eq 2 ]; then
            printf '::error::Agent-attribution scan could not run\n'
            echo "Could not resolve ${BASE_SHA}..${HEAD_SHA}. The scanner fails" >&2
            echo "closed rather than reporting clean — check the checkout depth." >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            printf '::error::Agent attribution found in this PR\n'
            cat >&2 <<'MSG'

          ───────────────────────────────────────────────────────────────
          This PR would attribute work to an AI agent in git history.
          Commits are attributed solely to the human committer.

          NOT allowed:
            • a Co-authored-by: trailer naming an agent (Claude, Codex,
              ChatGPT, Copilot, Gemini, …) or using an agent email
            • a commit whose author/committer identity is an agent — an
              @anthropic.com / @openai.com email, or an agent name (Claude,
              Codex, …). GitHub App bots (…[bot]) are exempt from this one.

          Fine (left untouched): links to an agent session, the "Generated
          with …" / "Generated by [Claude Code]" footers, and ordinary PR
          comments.

          MERGING PAST THIS CHECK DOES NOT AVOID IT. GitHub's squash credits
          every distinct branch commit author as a co-author, so an agent
          identity above becomes a real

            Co-authored-by: Claude <noreply@anthropic.com>

          trailer on the default branch. Repoint the identity and force-push
          the branch instead:

            git config user.name  "<your name>"
            git config user.email "<your email>"
            git rebase --exec 'git commit --amend --no-edit --reset-author' \
              origin/main

          And remove any Co-authored-by line from the PR description too, not
          just the commits.
          ───────────────────────────────────────────────────────────────
          MSG
            exit 1
          fi

  drift:
    # Post-merge backstop. `co-authors` can only block a merge when it is a
    # required status check; until then (and against admin overrides / direct
    # pushes) this makes a breach loud and pins it to one push, instead of it
    # sitting undiscovered in the permanent history.
    name: Main history has no agent attribution
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the commits this push added
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Determining WHAT this push added is the whole job, and getting it
          # wrong silently under-scans. Three cases:
          #
          #  • Branch creation — `before` is all-zero. Scan everything reachable
          #    from the new tip; there is no earlier state to diff against.
          #  • Ordinary push / squash merge — `before` is the previous tip and
          #    `fetch-depth: 0` has it. Scan before..after.
          #  • Force push — `before` is ALSO the previous tip (GitHub does not
          #    zero it; it flags `forced` separately), but that commit may now be
          #    unreachable and so absent from the clone. Try to fetch it by sha.
          #
          # If the old tip cannot be resolved even after fetching, we do NOT
          # narrow to the tip commit: a multi-commit force push would then hide
          # attribution in every replacement commit but the last. We fail instead
          # — a red run demanding a manual look is the correct outcome for a gate
          # that cannot see its own scope.
          if [ -z "${BEFORE_SHA//0/}" ]; then
            range="${AFTER_SHA}"
            echo "Branch creation — scanning all history reachable from ${AFTER_SHA}"
          else
            if ! git rev-parse --quiet --verify "${BEFORE_SHA}^{commit}" >/dev/null; then
              echo "Previous tip ${BEFORE_SHA} not in the clone (force push?) — fetching it"
              git fetch --no-tags --quiet origin "${BEFORE_SHA}" || true
            fi
            if ! git rev-parse --quiet --verify "${BEFORE_SHA}^{commit}" >/dev/null; then
              printf '::error::Cannot determine what this push added\n'
              cat >&2 <<MSG

          The previous tip ${BEFORE_SHA} could not be resolved, even after
          fetching it by sha, so the set of commits this push added is unknown.
          Scanning only ${AFTER_SHA} would silently miss every other commit of a
          multi-commit force push, so this job fails instead.

          Check the pushed commits by hand:
            git fetch origin main && git log --format='%H %an <%ae>' origin/main
          MSG
              exit 1
            fi
            range="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          echo "Scanning ${range}"

          .github/scripts/agent-attribution-scan.sh --range "$range"
          status=$?
          if [ "$status" -eq 2 ]; then
            printf '::error::Agent-attribution scan could not run\n'
            echo "The scanner could not resolve '${range}'. It fails closed rather" >&2
            echo "than reporting clean — investigate before trusting this push." >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            printf '::error::Agent attribution reached the default branch\n'
            cat >&2 <<'MSG'

          ───────────────────────────────────────────────────────────────
          Agent attribution is present in commits just pushed.

          The PR-layer check either was not a required status check, was
          overridden, or was bypassed by a direct push. Fixing this now means
          rewriting published history — weigh that against the release tags and
          artifacts already pointing at it before you do.

          To stop it recurring, make "Scan commits and PR body" a REQUIRED
          status check on the branch ruleset.
          ───────────────────────────────────────────────────────────────
          MSG
            exit 1
          fi

  self-test:
    # The detector is the only thing standing between an agent identity and the
    # permanent history, and its failure mode is silent: a matcher that quietly
    # stops matching still exits 0 and still prints "no agent attribution
    # found". So it gets its own tests, run on every PR and every push, driving
    # the real scripts and both hooks end to end.
    name: Detector self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run the agent-attribution self-test
        run: scripts/test-agent-attribution.sh
