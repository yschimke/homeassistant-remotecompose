name: Public demo HA security
on:
  pull_request:
    paths: ['deploy/demo-ha/**', '.github/workflows/demo-ha.yml']
  push:
    branches: [main]
    paths: ['deploy/demo-ha/**', '.github/workflows/demo-ha.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/demo-ha
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.1'
      - run: pip install -r requirements-test.txt
      - name: Gateway deny-by-default and live update tests
        run: python -m unittest discover -v
      - name: Validate and start dedicated Home Assistant
        run: |
          bash provision.sh
      - name: Enable guarded native dashboard
        run: |
          bash enable-native.sh
          docker compose -f compose.yaml -f compose.native.yaml -f compose.native-ci.yaml up -d --no-deps native
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Install native dashboard browser tools
        run: |
          npm install --no-save --prefix ../../embed playwright@1.56.1
          ../../embed/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify native login, live dashboard and denied writes
        run: node --test native_browser.test.mjs
      - name: Recheck existing public API after native setup
        run: docker compose --profile verify run --rm verify
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-demo-evidence
          path: build/native-demo-evidence/
      - name: Diagnose container startup on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.native.yaml ps --all
          docker compose -f compose.yaml -f compose.native.yaml logs --no-color --tail 100 homeassistant gateway native
      - name: Stop isolated demo
        if: always()
        run: docker compose -f compose.yaml -f compose.native.yaml --profile setup --profile verify --profile native-setup down --volumes
