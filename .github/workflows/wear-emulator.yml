name: Wear emulator

on:
  pull_request:
    branches: [main]
    paths:
      - 'wear/**'
      - 'wear-sync-proto/**'
      - 'rc-*/**'
      - 'ha-model/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/actions/android-sdk/**'
      - '.github/workflows/wear-emulator.yml'
      - 'scripts/run-wear-connected-tests.sh'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: wear-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wear-test:
    name: Wear OS 7 instrumentation (API 37)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS
      - uses: gradle/actions/setup-gradle@v6.4.0
      - uses: ./.github/actions/android-sdk
      - name: Build Wear app and test APKs before booting
        run: ./gradlew :wear:assembleDebug :wear:assembleDebugAndroidTest --stacktrace --max-workers=2
      - name: Run Wear connected tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: '37.0'
          target: android-wear-signed
          arch: x86_64
          profile: wearos_small_round
          ram-size: 2048M
          disk-size: 2G
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          # swangle_indirect, not swiftshader_indirect: under the latter the API 37 Wear image's
          # system_server crashes in its android.display thread right after loading mapper/ranchu,
          # zygote restarts every ~5 s and boot never completes (adb stays "offline").
          # -show-kernel keeps the guest's boot on the job log, the only record when adbd never starts.
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -show-kernel
          # Wear OS 6+ images are only published signed (release-keys, ro.adb.secure=1), so adbd
          # accepts only an authorized host key. The emulator passes ~/.android/adbkey.pub to the
          # guest at boot only if it already exists, so create it before launch.
          pre-emulator-launch-script: |
            "$ANDROID_HOME/platform-tools/adb" start-server
            test -s ~/.android/adbkey.pub
          disable-animations: true
          script: bash scripts/run-wear-connected-tests.sh
      - name: Show instrumented test failures
        if: failure()
        run: python3 scripts/summarize-android-test-failures.py
      - name: Upload Wear runtime evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wear-api-37-runtime
          path: |
            wear/build/reports/androidTests/**
            wear/build/outputs/androidTest-results/**
            build/wear-runtime/**
          if-no-files-found: warn
