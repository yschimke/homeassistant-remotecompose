name: Compose Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:

# Workflow-level: read only. The render job widens to write below so fork
# PRs running via `pull_request` don't inherit write scopes by default.
permissions:
  contents: read

concurrency:
  # `push` to main / `workflow_dispatch` end with a `git push` to the shared
  # `compose-preview/main` branch (in the -out repository, see the apply step
  # below) — don't cancel those mid-flight (a cancel
  # between commit-tree and push can leave the remote half-advanced). PRs
  # are safe to cancel; the comment composite handles being interrupted.
  group: compose-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apply:
    name: Render previews (baseline or PR comment, auto-selected)
    # Skip on release-please PRs: they only bump the manifest, CHANGELOG and
    # version lines, all of which main's push CI already built. Matches the
    # bot-authored PR (or a bot dispatch); humans and main always run it.
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    # Render, a11y and the PR-comment comparison all scale with how many
    # previews a PR changes: one touching ~120 (a grid or dashboard-wide
    # change) took 28-31 minutes, so 30 left no headroom.
    timeout-minutes: 45
    permissions:
      # The composite action either pushes to compose-preview/main (baseline
      # mode) or appends to compose-preview/pr + posts a sticky PR comment
      # (comment mode). Those generated branches live in
      # yschimke/homeassistant-remotecompose-out and are pushed with
      # ARTIFACTS_TOKEN, not this job's GITHUB_TOKEN; contents write is kept
      # for the action's same-repository fallback (an unset secret), and
      # comment mode needs pull-requests write for the sticky comment.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The composite action pushes via an explicit token in the remote
          # URL embedded in its push step, so we don't need the default git
          # credentials persisted here.
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      - uses: yschimke/compose-ai-tools/.github/actions/apply@v2.60.0
        with:
          # Generated branches (compose-preview/main, compose-preview/pr and the
          # a11y / resources pairs) go to the public output repository so this
          # source repository stops accumulating generated PNG history. The
          # comment's raw image links and the comment-mode baseline fetch follow
          # the same repository. ARTIFACTS_TOKEN has contents write on -out only.
          #
          # Fork PRs get no secrets, so the token is empty there and the action
          # falls back to this job's GITHUB_TOKEN: the baseline fetch still works
          # (-out is public), and the push fails exactly as it did before this
          # move, when a fork's read-only token could not push here either.
          artifact-repository: yschimke/homeassistant-remotecompose-out
          artifacts-token: ${{ secrets.ARTIFACTS_TOKEN }}
          cli-version: catalog
          catalog-key: compose-preview-plugin
          # One known preview cannot render, and it is one nobody wrote:
          # `activity__MainActivity`. The plugin synthesises a preview per
          # `<activity>` in the merged manifest (the launcher activity's render
          # is meant to be the app's hero image), and the renderer deliberately
          # pins a stub `android.app.Application` so previews don't run
          # app-lifecycle init. `MainActivity.onCreate` reads its DI graph via
          # `application as TerrazzoApplication`, so under the stub it throws
          # ClassCastException and produces no PNG — which under the action's
          # default `fail` policy has gated this workflow red since the
          # 0.17.19 -> 0.17.20 plugin bump.
          #
          # `warn` keeps the render reported (the id and its stack trace still
          # land in the log and the composePreviewRender-reports artifact) but
          # stops one tool-generated hero image from failing the run. The
          # documented alternative, `composePreview.useConsumerApplication`,
          # would run TerrazzoApplication.onCreate in every render sandbox —
          # it installs crash logging, starts wear sync, and flips the
          # process-global `enableRemoteComposeWrapContent()` /
          # `enableRemoteImageUrls()` switches, which would change how the
          # module's other previews rasterise. Not worth it for one image.
          #
          # `warn` alone would also swallow a real regression, so it is paired
          # with the narrower gate in the step below — the policy is "a
          # synthetic activity render may fail", not "any render may fail".
          missing-renders: warn

      # Restores the gate `missing-renders: warn` gives up, narrowed to what is
      # actually unfixable here: a preview nobody wrote. Any AUTHORED preview
      # that fails to render still fails the run. Runs on failure too, so a red
      # render is diagnosed rather than masked by an earlier step's exit.
      - name: Fail on authored preview render errors
        if: always()
        run: bash .github/scripts/check-render-errors.sh .
