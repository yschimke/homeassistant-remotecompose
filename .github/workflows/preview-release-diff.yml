name: Preview Release Diff

# Release-to-release preview comparison. When release-please publishes a
# release, this renders every @Preview at the previous release tag and at the
# new one, and compares them by the sha256 the compose-preview CLI reports. It
# then:
#   - pushes the before/after PNGs of every changed or new preview to the
#     `compose-preview/releases` branch of OUT_REPO, under `<tag>/`;
#   - appends a collapsed "Preview changes since <previous tag>" section to the
#     release notes, in the same shape as a PR's preview-diff comment;
#   - when anything changed, runs the Preview Audit (preview-audit.yml, release
#     mode) once over that set and appends its findings to the release notes.
#
# This sweeps up everything merged between two releases in one place,
# including the follow-up fixes PR reviews lead to, so the per-PR audit can stay
# on request (`/audit`).
#
# Called from release-please.yml (a release created with GITHUB_TOKEN raises no
# `release` event). Manual run: Actions -> Preview Release Diff -> Run workflow
# with a tag, and optionally the tag to compare against.
#
# Both sides render with the compose-preview CLI their own version catalog pins
# (CATALOG_KEY). A side whose catalog has no pin uses the new tag's. A renderer
# bump between the two releases can therefore show up as changes of its own.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to compare (e.g. v0.1.10)
        required: true
        type: string
      base:
        description: Tag to compare against (default the previous v* tag)
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to compare (e.g. v0.1.10)
        required: true
      base:
        description: Tag to compare against (default the previous v* tag)
        required: false
        default: ''

permissions: {}

concurrency:
  group: preview-release-diff-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Where the before/after PNGs are pushed: the public output repository, with
  # ARTIFACTS_TOKEN (contents write on -out only), as compose-preview.yml does.
  OUT_REPO: yschimke/homeassistant-remotecompose-out
  # The version-catalog key that pins the compose-preview CLI.
  CATALOG_KEY: compose-preview-plugin

jobs:
  prep:
    name: Pick the tags and the CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      head: ${{ steps.tags.outputs.head }}
      base: ${{ steps.tags.outputs.base }}
      cli: ${{ steps.tags.outputs.cli }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: tags
        env:
          HEAD_TAG: ${{ inputs.tag }}
          BASE_TAG: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet "refs/tags/$HEAD_TAG" >/dev/null || { echo "::error::No tag $HEAD_TAG"; exit 1; }
          base="$BASE_TAG"
          if [ -z "$base" ]; then
            # The newest v* tag reachable from the parent of this release.
            base=$(git tag --merged "$HEAD_TAG^" --sort=-v:refname --list 'v[0-9]*' | head -1)
          fi
          [ -n "$base" ] || { echo "::notice::No earlier release tag than $HEAD_TAG; nothing to compare."; }
          cli=$(python3 -c 'import sys,tomllib; print(tomllib.load(open("gradle/libs.versions.toml","rb")).get("versions",{}).get(sys.argv[1],""))' "$CATALOG_KEY")
          [ -n "$cli" ] || { echo "::error::$HEAD_TAG pins no compose-preview CLI under versions.$CATALOG_KEY"; exit 1; }
          echo "Comparing $HEAD_TAG with ${base:-nothing} (CLI $cli for sides without a pin)"
          { echo "head=$HEAD_TAG"; echo "base=$base"; echo "cli=$cli"; } >> "$GITHUB_OUTPUT"

  render:
    name: Render ${{ matrix.side }}
    needs: prep
    if: needs.prep.outputs.base != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: [base, head]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.side == 'base' && needs.prep.outputs.base || needs.prep.outputs.head }}
          persist-credentials: false

      # --- this repository's build setup (as compose-preview.yml) ---
      - uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      # --- end of build setup ---

      - id: cli
        env:
          FALLBACK: ${{ needs.prep.outputs.cli }}
        run: |
          set -euo pipefail
          v=$(python3 -c 'import sys,tomllib; print(tomllib.load(open("gradle/libs.versions.toml","rb")).get("versions",{}).get(sys.argv[1],""))' "$CATALOG_KEY")
          echo "version=${v:-$FALLBACK}" >> "$GITHUB_OUTPUT"
      - uses: yschimke/compose-ai-tools/.github/actions/install@v2.79.2
        with:
          version: ${{ steps.cli.outputs.version }}

      - name: Render every preview
        run: |
          set -uo pipefail
          mkdir -p _release
          # A preview that fails to render is left out of the JSON rather than failing the
          # comparison; the render log keeps the reason.
          compose-preview show --json > _release/show.json 2> _release/show.log
          status=$?
          [ "$status" -eq 0 ] || echo "::warning::compose-preview show exited $status; comparing what rendered."
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"] + "/"
          d = json.load(open("_release/show.json"))
          pngs = []
          for p in d["previews"] if isinstance(d, dict) else d:
              for c in p.get("captures") or []:
                  if c.get("pngPath", "").startswith(ws):
                      c["pngPath"] = c["pngPath"][len(ws):]
                  if c.get("pngPath") and os.path.exists(c["pngPath"]):
                      pngs.append(c["pngPath"])
          json.dump(d, open("_release/show.json", "w"))
          open("_release/pngs.txt", "w").write("\n".join(pngs) + "\n")
          print(f"{len(pngs)} capture(s) rendered")
          PY
          tar czf _release/renders.tgz -T _release/pngs.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-render-${{ matrix.side }}
          path: |
            _release/show.json
            _release/show.log
            _release/renders.tgz
          retention-days: 14

  compare:
    name: Compare and publish
    needs: [prep, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The release notes, and (when OUT_REPO is this repository) the image branch.
      contents: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prep.outputs.head }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-render-*
          path: _dl
      - id: diff
        env:
          BASE: ${{ needs.prep.outputs.base }}
          HEAD: ${{ needs.prep.outputs.head }}
        run: |
          set -euo pipefail
          for side in base head; do
            mkdir -p "_r/$side"
            tar xzf "_dl/release-render-$side/renders.tgz" -C "_r/$side"
          done
          python3 .github/scripts/release-preview-diff.py \
            _dl/release-render-base/show.json _dl/release-render-head/show.json \
            --base-root _r/base --head-root _r/head \
            --base-tag "$BASE" --head-tag "$HEAD" --out _out \
            --image-url-prefix '@@IMAGES@@'
          changed=$(jq '.changed + .new' _out/summary.json)
          echo "changed=$([ "$changed" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          jq -r '"Changed: \(.changed) · New: \(.new) · Removed: \(.removed) · Unchanged: \(.unchanged)"' _out/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Push the images
        if: steps.diff.outputs.changed == 'true'
        id: push
        env:
          PUSH_TOKEN: ${{ secrets.ARTIFACTS_TOKEN || github.token }}
          HEAD: ${{ needs.prep.outputs.head }}
          BASE: ${{ needs.prep.outputs.base }}
        run: |
          set -euo pipefail
          branch=compose-preview/releases
          work=$(mktemp -d)
          git -C "$work" init -q
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -C "$work" config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git -C "$work" remote add origin "https://github.com/$OUT_REPO.git"
          if git -C "$work" ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git -C "$work" fetch -q --depth 1 origin "$branch"
            git -C "$work" checkout -q -B "$branch" FETCH_HEAD
          else
            git -C "$work" checkout -q --orphan "$branch"
          fi
          rm -rf "${work:?}/$HEAD"
          mkdir -p "$work/$HEAD"
          cp -r _out/images/. "$work/$HEAD/"
          sed "s#@@IMAGES@@#.#g" _out/diff.md > "$work/$HEAD/README.md"
          git -C "$work" add -A
          git -C "$work" -c user.name='Yuri Schimke' -c user.email='yuri@schimke.ee' \
            commit -q -m "Preview changes in $HEAD since $BASE" || echo "Nothing new to commit."
          git -C "$work" push -q origin "HEAD:$branch"
          echo "sha=$(git -C "$work" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Add the comparison to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ needs.prep.outputs.head }}
          BASE: ${{ needs.prep.outputs.base }}
          SHA: ${{ steps.push.outputs.sha }}
          CHANGED: ${{ steps.diff.outputs.changed }}
        run: |
          set -euo pipefail
          sed "s#@@IMAGES@@#https://raw.githubusercontent.com/$OUT_REPO/${SHA:-main}/$HEAD#g" _out/diff.md > _out/diff-linked.md
          gh release view "$HEAD" --repo "$REPO" --json body --jq .body > _out/body.md
          python3 - <<'PY'
          import json, os, re
          body = open("_out/body.md").read()
          start, end = "<!-- preview-release-diff:start -->", "<!-- preview-release-diff:end -->"
          body = re.sub(re.escape(start) + ".*?" + re.escape(end), "", body, flags=re.S).rstrip()
          s = json.load(open("_out/summary.json"))
          diff = open("_out/diff-linked.md").read().split("\n", 2)[2].strip()  # drop marker + title
          summary = (f"Preview changes since {os.environ['BASE']}: {s['changed']} changed, "
                     f"{s['new']} new, {s['removed']} removed")
          section = f"{start}\n\n<details>\n<summary>{summary}</summary>\n\n{diff}\n\n</details>\n{end}"
          out = (body + "\n\n" + section + "\n").lstrip()
          if len(out) > 120000:
              out = (body + f"\n\n{start}\n\n{summary}. Too many to list here; see the "
                     f"`compose-preview/releases` branch of {os.environ['OUT_REPO']}.\n{end}\n")
          open("_out/notes.md", "w").write(out)
          PY
          gh release edit "$HEAD" --repo "$REPO" --notes-file _out/notes.md >/dev/null
      - uses: actions/upload-artifact@v7.0.2
        with:
          # preview-audit.yml's release mode reads diff.md from here.
          name: release-preview-diff
          path: _out/diff-linked.md
          retention-days: 14

  audit:
    name: Audit
    needs: [prep, compare]
    if: needs.compare.outputs.changed == 'true'
    uses: ./.github/workflows/preview-audit.yml
    with:
      release: ${{ needs.prep.outputs.head }}
      base: ${{ needs.prep.outputs.base }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
