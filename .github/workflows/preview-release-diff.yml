name: Preview Release Diff

# Release-to-release preview comparison. Renders every @Preview at the previous release tag and at
# the new one, compares them by sha256, pushes the before/after PNGs of every changed or new preview
# to the `compose-preview/releases` branch of yschimke/homeassistant-remotecompose-out, and adds a
# collapsed "Preview changes since <previous tag>" section to the release notes. When anything
# changed, the Preview Audit (preview-audit.yml, release mode) runs once over that set and appends
# its findings to the release notes.
#
# Inlined from yschimke/compose-ai-tools/.github/workflows/preview-release-diff-reusable.yml
# because that reusable workflow pins `.github/actions/release-preview-diff@v2.83.0`, and
# `release-preview-diff` did not exist at v2.83.0. Keeping the action pins here at @v2.92.0
# lets Renovate update them directly.
#
# Called from release-please.yml, because a release created with GITHUB_TOKEN raises no `release`
# event. Manual run: Actions -> Preview Release Diff -> Run workflow with a tag, and optionally
# the tag to compare against.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to compare (e.g. v0.1.10)
        required: true
        type: string
      base:
        description: Tag to compare against (default the previous v* tag)
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to compare (e.g. v0.1.10)
        required: true
      base:
        description: Tag to compare against (default the previous v* tag)
        required: false
        default: ''

permissions: {}

concurrency:
  group: preview-release-diff-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prep:
    name: Pick the tags and the CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      head: ${{ steps.tags.outputs.head }}
      base: ${{ steps.tags.outputs.base }}
      cli: ${{ steps.tags.outputs.cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: tags
        env:
          HEAD_TAG: ${{ inputs.tag }}
          BASE_TAG: ${{ inputs.base }}
          CATALOG_KEY: compose-preview-plugin
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet "refs/tags/$HEAD_TAG" >/dev/null || { echo "::error::No tag $HEAD_TAG"; exit 1; }
          base="$BASE_TAG"
          if [ -z "$base" ]; then
            # The newest v* tag reachable from the parent of this release.
            base=$(git tag --merged "$HEAD_TAG^" --sort=-v:refname --list 'v[0-9]*' | head -1)
          fi
          [ -n "$base" ] || echo "::notice::No earlier release tag than $HEAD_TAG; nothing to compare."
          cli=$(python3 -c 'import sys,tomllib; print(tomllib.load(open("gradle/libs.versions.toml","rb")).get("versions",{}).get(sys.argv[1],""))' "$CATALOG_KEY")
          [ -n "$cli" ] || { echo "::error::$HEAD_TAG pins no compose-preview CLI under versions.$CATALOG_KEY"; exit 1; }
          echo "Comparing $HEAD_TAG with ${base:-nothing} (CLI $cli for sides without a pin)"
          { echo "head=$HEAD_TAG"; echo "base=$base"; echo "cli=$cli"; } >> "$GITHUB_OUTPUT"

  render:
    name: Render ${{ matrix.side }}
    needs: prep
    if: needs.prep.outputs.base != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        side: [base, head]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.side == 'base' && needs.prep.outputs.base || needs.prep.outputs.head }}
          persist-credentials: false
      - name: Set up the build (the repository's own action)
        uses: ./.github/actions/setup
        with:
          cache-read-only: 'true'
      - id: cli
        env:
          FALLBACK: ${{ needs.prep.outputs.cli }}
          CATALOG_KEY: compose-preview-plugin
        run: |
          set -euo pipefail
          v=$(python3 -c 'import sys,tomllib; print(tomllib.load(open("gradle/libs.versions.toml","rb")).get("versions",{}).get(sys.argv[1],""))' "$CATALOG_KEY")
          echo "version=${v:-$FALLBACK}" >> "$GITHUB_OUTPUT"
      - uses: yschimke/compose-ai-tools/.github/actions/install@v2.103.0
        with:
          version: ${{ steps.cli.outputs.version }}
      - name: Render every preview
        run: |
          set -uo pipefail
          mkdir -p _release
          # A preview that fails to render is left out of the JSON rather than failing the
          # comparison; the render log keeps the reason.
          compose-preview show --variant debug --json > _release/show.json 2> _release/show.log
          status=$?
          [ "$status" -eq 0 ] || echo "::warning::compose-preview show exited $status; comparing what rendered."
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"] + "/"
          d = json.load(open("_release/show.json"))
          pngs = []
          for p in d["previews"] if isinstance(d, dict) else d:
              for c in p.get("captures") or []:
                  if (c.get("pngPath") or "").startswith(ws):
                      c["pngPath"] = c["pngPath"][len(ws):]
                  if c.get("pngPath") and os.path.exists(c["pngPath"]):
                      pngs.append(c["pngPath"])
          json.dump(d, open("_release/show.json", "w"))
          open("_release/pngs.txt", "w").write("\n".join(pngs) + "\n")
          print(f"{len(pngs)} capture(s) rendered")
          PY
          tar czf _release/renders.tgz -T _release/pngs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-render-${{ matrix.side }}
          path: |
            _release/show.json
            _release/show.log
            _release/renders.tgz
          retention-days: 14

  diff:
    name: Compare and publish
    needs: [prep, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      head: ${{ needs.prep.outputs.head }}
      base: ${{ needs.prep.outputs.base }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-render-*
          path: _dl
      - id: diff
        uses: yschimke/compose-ai-tools/.github/actions/release-preview-diff@v2.103.0
        with:
          base-tag: ${{ needs.prep.outputs.base }}
          head-tag: ${{ needs.prep.outputs.head }}
          out-repo: yschimke/homeassistant-remotecompose-out
          push-token: ${{ secrets.ARTIFACTS_TOKEN }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preview-diff
          path: _out/diff-linked.md
          retention-days: 14

  audit:
    name: Audit
    needs: diff
    if: needs.diff.outputs.changed == 'true'
    uses: ./.github/workflows/preview-audit.yml
    with:
      release: ${{ needs.diff.outputs.head }}
      base: ${{ needs.diff.outputs.base }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
