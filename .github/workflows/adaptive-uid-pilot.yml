name: Adaptive UID pilot

on:
  pull_request:
    paths:
      - 'adaptive-uid-pilot/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/adaptive-uid-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'adaptive-uid-pilot/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/adaptive-uid-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-uid-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Check interactions and render candidate matrix
        run: >-
          ./gradlew -PadaptiveUidPilot=true
          :adaptive-uid-pilot:ktfmtCheck
          :adaptive-uid-pilot:test
          :adaptive-uid-pilot:renderPilot
      # Reference rendering needs the companion server's native UID bundle. This job
      # publishes candidate evidence only; it never silently refreshes the baseline.
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: adaptive-uid-pilot-candidates
          path: |
            adaptive-uid-pilot/build/pilot/previews/*.png
            adaptive-uid-pilot/build/reports/tests/**
          if-no-files-found: error
