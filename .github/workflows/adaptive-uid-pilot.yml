name: Adaptive UID pilot

on:
  pull_request:
    paths:
      - 'adaptive-uid-pilot/**'
      - 'gradle/**'
      - 'build-logic/**'
      - '*.gradle.kts'
      - '.github/workflows/adaptive-uid-*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: adaptive-uid-pilot-${{ github.ref }}
  cancel-in-progress: true

# Shared UID capture, comparison and prepared catalog export (merged main commit).
jobs:
  parity:
    uses: yschimke/design-parity/.github/workflows/uid-parity-reusable.yml@af2f6a34342d5cfa5db2c00cd66ba46ca6e375eb
    with:
      export-catalog: true
      pilot-directory: adaptive-uid-pilot
      artifact-prefix: adaptive-uid
      bundle-name: dashboards
      build-command: >-
        ./gradlew -PadaptiveUidPilot=true
        :adaptive-uid-pilot:ktfmtCheck
        :adaptive-uid-pilot:test
        :adaptive-uid-pilot:renderPilot
