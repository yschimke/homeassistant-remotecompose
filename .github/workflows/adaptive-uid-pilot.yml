name: Adaptive UID pilot

on:
  pull_request:
    paths:
      - 'adaptive-uid-pilot/**'
      - 'gradle/**'
      - 'build-logic/**'
      - '*.gradle.kts'
      - '.github/workflows/adaptive-uid-*.yml'
  push:
    branches: [main]
    paths:
      - 'adaptive-uid-pilot/**'
      - 'gradle/**'
      - 'build-logic/**'
      - '*.gradle.kts'
      - '.github/workflows/adaptive-uid-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-uid-pilot-${{ github.ref }}
  cancel-in-progress: true

# Shared setup: https://github.com/yschimke/design-parity/pull/538
jobs:
  parity:
    uses: yschimke/design-parity/.github/workflows/uid-parity-reusable.yml@ff9487c46a08cf0fea77e7ddd15b840753e1021f
    with:
      pilot-directory: adaptive-uid-pilot
      build-command: >-
        ./gradlew -PadaptiveUidPilot=true
        :adaptive-uid-pilot:ktfmtCheck
        :adaptive-uid-pilot:test
        :adaptive-uid-pilot:renderPilot
