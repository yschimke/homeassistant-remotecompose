name: Adaptive UID pilot

on:
  pull_request:
    paths:
      - 'adaptive-uid-pilot/**'
      - 'gradle/**'
      - 'build-logic/**'
      - '*.gradle.kts'
      - '.github/workflows/adaptive-uid-*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: adaptive-uid-pilot-${{ github.ref }}
  cancel-in-progress: true

# Shared setup: https://github.com/yschimke/design-parity/pull/541
# Integration-test pin. Replace with the landed revision before merging this caller.
jobs:
  parity:
    uses: yschimke/design-parity/.github/workflows/uid-parity-reusable.yml@aa613cba6e87848102b356dd36d2f7b456c94e59
    with:
      export-catalog: true
      pilot-directory: adaptive-uid-pilot
      artifact-prefix: adaptive-uid
      bundle-name: dashboards
      build-command: >-
        ./gradlew -PadaptiveUidPilot=true
        :adaptive-uid-pilot:ktfmtCheck
        :adaptive-uid-pilot:test
        :adaptive-uid-pilot:renderPilot
