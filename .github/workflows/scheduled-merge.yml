name: Scheduled Merge

# Merges open PRs automatically once they pass the "Protect Main" merge
# gates: every 30 minutes, any non-draft PR whose mergeable state is `clean`
# (all required status checks green, no conflicts) is squash-merged.
#
# Opt-outs, checked per PR:
#   - draft PRs are skipped
#   - the `no-automerge` label blocks merging
#   - release-please PRs (`autorelease: pending` label) are skipped so
#     cutting a release stays a deliberate human action
#
# GITHUB_TOKEN merges don't fire push-to-main workflows, so after merging
# this dispatches compose-preview.yml to refresh the render baselines. When
# the merged batch included a dependency bump, it also dispatches
# design-artifacts.yml so the published catalog delivery branches are
# regenerated: a compose-ai-tools release moves the renderer itself, and any
# other dependency moves what that renderer draws.
#
# This dispatch only covers the merges made HERE. Renovate automerges its own
# compose-ai-tools PRs, and those never reach this job — they're handled by
# design-artifacts.yml's own `push` trigger, which a Renovate (app token)
# merge does raise. Keep the two in sync: the path filter there and the
# dependency test here should agree on what warrants a republish.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: scheduled-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge passing PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const skipLabels = new Set(['no-automerge', 'autorelease: pending']);
            // Only PRs targeting main — the CI gates this relies on are
            // filtered to pull_request against main.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });
            let merged = 0;
            let bumpedDependency = false;
            for (const stub of prs) {
              if (stub.draft) continue;
              if (stub.labels.some((l) => skipLabels.has(l.name))) {
                core.info(`#${stub.number}: opt-out label — skip`);
                continue;
              }
              // pulls.list doesn't populate mergeable_state; fetch the PR.
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: stub.number,
              });
              if (pr.mergeable_state !== 'clean') {
                core.info(`#${pr.number}: ${pr.mergeable_state} — skip`);
                continue;
              }
              try {
                // sha guard: reject the merge if the head moved after the
                // mergeable_state check (race with a new push).
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number, merge_method: 'squash',
                  sha: pr.head.sha,
                });
                core.notice(`Merged #${pr.number}: ${pr.title}`);
                merged++;
                // Any dependency bump can change the published catalog, so
                // flag it to regenerate the delivery branches below: a
                // compose-ai-tools bump moves the renderer/CLI itself, and
                // every other dependency moves what that renderer draws.
                // Renovate labels its PRs `dependencies` and titles them
                // `<type>(deps): …` — match either, so a hand-relabelled or
                // hand-retitled bump still counts.
                const isDependencyBump =
                  (pr.labels || []).some((l) => l.name === 'dependencies') ||
                  /\(deps[^)]*\)/i.test(pr.title) ||
                  `${pr.head.ref} ${pr.title}`.toLowerCase().includes('compose-ai-tools');
                if (isDependencyBump) {
                  core.info(`#${pr.number}: dependency bump — will regenerate design artifacts`);
                  bumpedDependency = true;
                }
              } catch (e) {
                core.warning(`#${pr.number}: merge failed — ${e.message}`);
              }
            }
            if (merged > 0) {
              // GITHUB_TOKEN merges don't trigger push workflows; explicitly
              // refresh the render baselines and the release-please PR. When a
              // dependency bump landed, also regenerate the design catalog
              // delivery branches against the new versions.
              const workflows = ['compose-preview.yml', 'release-please.yml'];
              if (bumpedDependency) workflows.push('design-artifacts.yml');
              for (const wf of workflows) {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner, repo, workflow_id: wf, ref: 'main',
                  });
                  core.info(`Dispatched ${wf}`);
                } catch (e) {
                  core.warning(`${wf} dispatch failed: ${e.message}`);
                }
              }
            }
