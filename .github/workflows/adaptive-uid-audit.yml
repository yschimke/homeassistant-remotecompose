name: Adaptive UID design audit

# Match remote-m3-catalog's OpenRouter guidelines lane. This workflow must land
# on the default branch before workflow_run can trigger it for PRs.
on:
  workflow_run:
    workflows: [Adaptive UID pilot]
    types: [completed]

permissions:
  contents: read
  actions: read

# Shared setup: https://github.com/yschimke/compose-ai-tools/pull/5783
# Pin the landed reusable workflow revision.
jobs:
  audit:
    uses: yschimke/compose-ai-tools/.github/workflows/uid-design-audit-reusable.yml@eeb325c65524810a75c4a5e9049c8f10a5be0caf
    with:
      enabled: true
      pilot-directory: adaptive-uid-pilot
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
