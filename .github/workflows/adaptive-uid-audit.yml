name: Adaptive UID design audit

# Match remote-m3-catalog's OpenRouter guidelines lane. This workflow must land
# on the default branch before workflow_run can trigger it for PRs.
on:
  workflow_run:
    workflows: [Adaptive UID pilot]
    types: [completed]

permissions:
  contents: read
  actions: read

# Shared setup: https://github.com/yschimke/compose-ai-tools/pull/5779
jobs:
  audit:
    uses: yschimke/compose-ai-tools/.github/workflows/uid-design-audit-reusable.yml@0ee70e11b70e3820ae1c7508ec9b5c8c4d843756
    with:
      pilot-directory: adaptive-uid-pilot
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
