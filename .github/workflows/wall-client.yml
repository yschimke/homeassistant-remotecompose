name: wall client

on:
  push:
    branches: [main]
    paths: &paths
      - 'wall-client/**'
      - '.github/workflows/wall-client.yml'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wall-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - run: wall-client/test/run.sh
