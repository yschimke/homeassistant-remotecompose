name: App restore emulator

# Backs the phone app up, reinstalls it and restores it on an emulator, against a real Home
# Assistant in Docker (`:app-container-tests`, Testcontainers). It checks what a user moving to a
# new phone sees: the app still knows its home, the token vault and the mobile_app registration are
# not restored (`app/src/main/res/xml/data_extraction_rules.xml`), and signing in again works.
#
# Slow and not a required check: it runs for changes to sign-in storage, the backup rules and this
# harness, and by hand.
on:
  pull_request:
    branches: [main]
    paths:
      - 'terrazzo-core/src/androidMain/kotlin/ee/schimke/terrazzo/core/auth/**'
      - 'terrazzo-core/src/androidMain/kotlin/ee/schimke/terrazzo/core/mobileapp/MobileAppStore.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/xml/data_extraction_rules.xml'
      - 'app/src/androidTest/kotlin/ee/schimke/terrazzo/restore/**'
      - 'app-container-tests/**'
      - '.github/workflows/app-restore-emulator.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: app-restore-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-test:
    name: Backup and restore (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS
      - uses: gradle/actions/setup-gradle@v6.4.1
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || '' }}
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - uses: ./.github/actions/android-sdk
      # Build and pull before booting, so the emulator's time goes to the test.
      - name: Build the app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app-container-tests:testClasses --stacktrace --max-workers=2
      - name: Pull the Home Assistant image
        run: docker pull ghcr.io/home-assistant/home-assistant:2026.11.1
      - name: Run the backup and restore test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 4G
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app-container-tests:test -PcontainerTests=true --stacktrace --max-workers=2
      - name: Upload restore test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-restore-emulator
          path: |
            app-container-tests/build/container-tests/**
            app-container-tests/build/reports/tests/**
          if-no-files-found: warn
