name: Card design server

# Generates the card design library (`:card-designs`), tests the design server on it, and builds
# its container image. Nothing is published or deployed: the library is uploaded as an artifact
# (`card-design-library`) for anyone to serve with `design-server`.
on:
  push:
    branches: [main]
    paths: &paths
      - card-designs/**
      - design-server/**
      - embed/**
      - rc-converter/src/main/**
      - rc-components/src/main/**
      - ha-model/src/**
      - ha-client/src/**
      - previews/src/main/**
      - gradle/libs.versions.toml
      - .github/workflows/design-server.yml
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: design-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library and server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS
      - uses: gradle/actions/setup-gradle@v6.4.0
      - uses: ./.github/actions/android-sdk
      - name: Generate the library and test the server
        run: ./gradlew :card-designs:generateCardDesigns :design-server:test :design-server:installDist --stacktrace
      - name: Test the card embed
        # The binding port against the Kotlin golden, tap resolution, and a headless-Chromium run
        # of <ha-card> with the real player and a stubbed Home Assistant. The player comes from
        # :design-server:embedResources, which the test task above already ran.
        run: |
          npm install --no-save --prefix embed playwright@1.56.1
          npx --prefix embed playwright install --with-deps chromium
          EMBED_SMOKE_REQUIRED=1 node --test embed/test/*.test.mjs
      - name: Serve the library
        run: |
          DESIGN_LIBRARY=card-designs/build/card-designs PORT=8080 \
            UI_BUILDER_URL=http://localhost:8724 UI_BUILDER_TOKEN=ci-token \
            java -cp "design-server/build/install/design-server/lib/*" ee.schimke.ha.designserver.MainKt &
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/designs/v1/manifest.json | python3 -c \
            'import json,sys; m=json.load(sys.stdin); assert m["designs"], "empty library"; print(len(m["designs"]), "designs")'
          curl -sf "localhost:8080/designs?style=all&mode=all" | grep -q "card types"
          curl -sf localhost:8080/ | grep -q "Make a card your own"
          curl -sf localhost:8080/embed/v1/ha-card.js | grep -q "customElements.define('ha-card'"
      - name: Test cross-origin Card Studio handoffs in Chromium
        run: STUDIO_SMOKE_REQUIRED=1 STUDIO_SERVER_URL=http://localhost:8080 node --test design-server/test/*.test.mjs
      - name: Build the container image
        run: docker build -f design-server/Dockerfile -t card-design-server .
      - name: Run the image with UI Builder and seed a design
        run: |
          docker run -d --name designs -p 8081:8080 -p 8724:8724 -e UI_BUILDER_TOKEN=ci-token card-design-server
          for i in $(seq 1 60); do curl -sf localhost:8081/healthz >/dev/null && break; sleep 2; done
          for i in $(seq 1 90); do curl -sf -o /dev/null "localhost:8724/ui-builder/remote-m3/?token=ci-token" && break; sleep 2; done
          curl -sf -c cookies.txt -o /dev/null "localhost:8081/edit?token=ci-token"
          location=$(curl -s -b cookies.txt -o /dev/null -w '%{redirect_url}' -X POST localhost:8081/ui-builder/designs \
            --data-urlencode 'card={"type":"entities","title":"Living room","entities":["light.kitchen","sensor.temp"]}')
          echo "editor: $location"
          id=$(echo "$location" | sed -E 's#.*/ui-builder/([^?]+)\?.*#\1#')
          test -n "$id"
          curl -sf -o seeded.png "localhost:8724/api/ui-builder/v1/designs/$id/export.png?token=ci-token"
          file seeded.png | grep -q PNG
      - name: Open an app draft in the bundled editor in Chromium
        run: STUDIO_SMOKE_REQUIRED=1 STUDIO_SERVER_URL=http://localhost:8081 STUDIO_OPERATOR_TOKEN=ci-token node --test design-server/test/*.test.mjs
      - name: Container logs
        if: always()
        run: docker logs designs 2>&1 | tail -100 || true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: card-design-library
          path: card-designs/build/card-designs
