name: Card design server

# Generates the card design library (`:card-designs`, on the JVM: the capture the server runs for a
# key its library lacks), checks a sample of it plays in the app's AndroidX player, tests the
# design server on it, and builds
# its container image. On `main` the image is published as ghcr.io/yschimke/ha-card-design-server
# (`latest` and the commit SHA), which the box behind ha.coo.ee (deployed from yschimke/preview-coo-ee)
# rolls out with Watchtower; pull requests only build it. The library is also uploaded as an artifact
# (`card-design-library`) for anyone to serve with `design-server`.
#
# Designs don't wait for the image: once the library passes its checks it is published straight to
# the running server (`.github/scripts/publish-design-library.py`, docs/architecture/
# card-design-server.md "Publishing"): to `main` on a push to main, and to the pull request's own
# channel `pr-<n>` for a pull request, which the design server lists as in flight and an app can
# play from `<server>/designs/v1/channels/pr-<n>`. Only what the server lacks is uploaded.
# `design-library-channels.yml` drops a pull request's channel when it closes. Without the
# LIBRARY_PUBLISH_TOKEN secret (a fork's pull request) nothing is published.
on:
  push:
    branches: [main]
    paths: &paths
      - card-designs/**
      - design-server/**
      - embed/**
      - lovelace-catalog/**
      - app-ui/**
      - rc-player-ui/**
      - rc-converter/src/**
      - rc-components/src/**
      - ha-model/src/**
      - ha-client/src/**
      - previews/src/main/**
      # The front page's screenshots, bundled into the image by :design-server:siteResources.
      - app/src/main/play/listings/en-GB/graphics/phone-screenshots/**
      - gradle/libs.versions.toml
      - .github/workflows/design-server.yml
      - .github/scripts/publish-design-library.py
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: design-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library and server
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium for ubuntu-26.04 (ubuntu-latest)
    timeout-minutes: 45
    permissions:
      contents: read
      # Pushes the image to GHCR on main; pull requests never reach that step.
      packages: write
      # The pull request's comment linking its published preview.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS
      - uses: gradle/actions/setup-gradle@v6.4.0
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN || '' }}
          ro-token: ${{ secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - uses: ./.github/actions/android-sdk
      - name: Generate the library and test the server
        run: ./gradlew :card-designs:generateCardDesigns :design-server:test :design-server:installDist --stacktrace
      - name: Play the library in the app's player
        # One key per card type and shape, across every theme: the JVM's bytes and the same key
        # captured on Android draw the same pixels in AndroidX's player (Robolectric).
        run: ./gradlew :card-designs:testAndroidHostTest --tests '*JvmLibraryAndroidPlaybackTest' --stacktrace
      - name: Publish the library to the design server
        id: publish
        # No image deploy needed: the server swaps the library in as it arrives. A push to main
        # publishes `main`; a pull request publishes its preview channel.
        env:
          DESIGN_SERVER_URL: ${{ vars.DESIGN_SERVER_URL || 'https://ha.coo.ee' }}
          LIBRARY_PUBLISH_TOKEN: ${{ secrets.LIBRARY_PUBLISH_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          if [ -z "$LIBRARY_PUBLISH_TOKEN" ]; then
            echo "No LIBRARY_PUBLISH_TOKEN (a fork's pull request?): not publishing."
            exit 0
          fi
          if [ "${{ github.event_name }}" = pull_request ]; then
            channel="pr-${{ github.event.pull_request.number }}"
            commit="${{ github.event.pull_request.head.sha }}"
            python3 .github/scripts/publish-design-library.py publish card-designs/build/card-designs "$channel" \
              --commit "$commit" --title "$PR_TITLE" --url "$PR_URL" --branch "$PR_BRANCH" --author "$PR_AUTHOR"
          else
            channel=main
            commit="${{ github.sha }}"
            python3 .github/scripts/publish-design-library.py publish card-designs/build/card-designs main --commit "$commit"
          fi
          server="${DESIGN_SERVER_URL%/}"
          if [ "$channel" = main ]; then browse="$server/designs"; app="$server/designs/v1"
          else browse="$server/designs?channel=$channel"; app="$server/designs/v1/channels/$channel"; fi
          echo "browse=$browse" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          {
            echo "### Card designs published to \`$channel\`"
            echo "- Browse: $browse"
            echo "- App design server URL: \`$app\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Link the preview from the pull request
        if: github.event_name == 'pull_request' && steps.publish.outputs.browse != ''
        uses: actions/github-script@v9.0.0
        env:
          BROWSE: ${{ steps.publish.outputs.browse }}
          APP: ${{ steps.publish.outputs.app }}
          COMMIT: ${{ steps.publish.outputs.commit }}
        with:
          script: |
            const marker = '<!-- design-library-preview -->';
            const body = [
              marker,
              '## Card design preview',
              '',
              `This pull request's card designs are live on the design server, built from \`${process.env.COMMIT.slice(0, 12)}\`, before it merges:`,
              '',
              `- Browse them: ${process.env.BROWSE}`,
              `- Try them in the app: set Settings → Card design server to \`${process.env.APP}\``,
              '',
              'Updated on every push; removed when the pull request closes.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Test the card embed
        # The binding port against the Kotlin golden, tap resolution, and a headless-Chromium run
        # of <ha-card> with the real player and a stubbed Home Assistant. The player comes from
        # :design-server:embedResources, which the test task above already ran.
        run: |
          npm install --no-save --prefix embed playwright@1.56.1
          npx --prefix embed playwright install --with-deps chromium
          EMBED_SMOKE_REQUIRED=1 node --test embed/test/*.test.mjs
      - name: Serve the library
        run: |
          DESIGN_LIBRARY=card-designs/build/card-designs PORT=8080 \
            UI_BUILDER_URL=http://localhost:8724 UI_BUILDER_TOKEN=ci-token \
            java -cp "design-server/build/install/design-server/lib/*" ee.schimke.ha.designserver.MainKt &
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/designs/v1/manifest.json | python3 -c \
            'import json,sys; m=json.load(sys.stdin); assert m["designs"], "empty library"; print(len(m["designs"]), "designs")'
          curl -sf "localhost:8080/designs?style=all&mode=all" | grep -q "card types"
          curl -sf localhost:8080/ | grep -q "Make a card your own"
          curl -sf localhost:8080/embed/v1/ha-card.js | grep -q "customElements.define('ha-card'"
      - name: Test cross-origin Card Studio handoffs in Chromium
        run: STUDIO_SMOKE_REQUIRED=1 STUDIO_SERVER_URL=http://localhost:8080 node --test design-server/test/*.test.mjs
      - name: Build the production WASM demo
        # The public /demo is the shared WASM host, packaged alongside the design server.
        # Keep this slower compilation in CI.
        run: ./gradlew :app-ui:wasmJsBrowserDistribution --stacktrace
      - name: Build the container with the demo
        run: docker build -f design-server/Dockerfile -t card-design-server .
      - name: Run the image with UI Builder and seed a design
        run: |
          docker run -d --name designs -p 8081:8080 -p 8724:8724 -e UI_BUILDER_TOKEN=ci-token \
            -e LIBRARY_PUBLISH_TOKEN=ci-token card-design-server
          for i in $(seq 1 60); do curl -sf localhost:8081/healthz >/dev/null && break; sleep 2; done
          # Publishing without a new image: a pull request's channel, shown in flight, then dropped.
          # The image seeded main from this library, so only what a publish stamps is sent.
          export DESIGN_SERVER_URL=http://localhost:8081 LIBRARY_PUBLISH_TOKEN=ci-token
          python3 .github/scripts/publish-design-library.py publish card-designs/build/card-designs pr-1 --title "CI smoke"
          curl -sf localhost:8081/designs/v1/channels/pr-1/manifest.json > /dev/null
          curl -sf "localhost:8081/designs?channel=pr-1" | grep -q "CI smoke"
          curl -sf localhost:8081/designs | grep -q "In-flight pull requests"
          python3 .github/scripts/publish-design-library.py delete pr-1
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8081/designs/v1/channels/pr-1/manifest.json)" = 404
          for i in $(seq 1 90); do curl -sf -o /dev/null "localhost:8724/ui-builder/remote-m3/?token=ci-token" && break; sleep 2; done
          curl -sf localhost:8081/demo/ | grep -q 'id="app"'
          curl -sf localhost:8081/demo/bootstrap.js | grep -q 'showLoadFailure'
          curl -sf -c cookies.txt -o /dev/null "localhost:8081/edit?token=ci-token"
          location=$(curl -sS --fail-with-body -b cookies.txt -o seed-response.txt -w '%{redirect_url}' -X POST localhost:8081/ui-builder/designs \
            --data-urlencode 'card={"type":"entities","title":"Living room","entities":["light.kitchen","sensor.temp"]}') || { cat seed-response.txt; exit 1; }
          echo "editor: $location"
          id=$(echo "$location" | sed -E 's#.*/ui-builder/([^?]+)\?.*#\1#')
          test -n "$id"
          curl -sf -o seeded.png "localhost:8724/api/ui-builder/v1/designs/$id/export.png?token=ci-token"
          file seeded.png | grep -q PNG
          # Resolve the actual published catalog, not just the static dashboard shell.
          curl -fsS localhost:8081/api/studio/dashboard/catalog -o dashboard-catalog.json
          python3 -c 'import json; c=json.load(open("dashboard-catalog.json")); assert c["statusSemantics"]["platform"] == "lovelace"'
          # The dashboard host serves the packaged editor on its own origin even without Caddy.
          curl -sf localhost:8081/studio/dashboard/editor.html | grep -q '/studio/dashboard/assets/uiBuilder.mjs'
          curl -sf localhost:8081/studio/dashboard/assets/uiBuilder.mjs -o dashboard-editor.mjs
          test -s dashboard-editor.mjs
          curl -sfI localhost:8081/studio/dashboard/assets/uiBuilder.wasm | grep -qi 'application/wasm'
      - name: Open an app draft in the bundled editor in Chromium
        run: STUDIO_SMOKE_REQUIRED=1 STUDIO_SERVER_URL=http://localhost:8081 STUDIO_OPERATOR_TOKEN=ci-token node --test design-server/test/*.test.mjs
      - name: Publish the image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/yschimke/ha-card-design-server
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag card-design-server "$IMAGE:latest"
          docker tag card-design-server "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Container logs
        if: always()
        run: docker logs designs 2>&1 | tail -100 || true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: card-design-library
          path: card-designs/build/card-designs
