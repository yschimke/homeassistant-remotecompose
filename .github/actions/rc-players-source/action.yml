name: Validate against pinned Remote Compose players
description: Build the unreleased input APIs from one immutable player revision in PR CI.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6.1.0
      with:
        distribution: temurin
        java-version: |
          17
          21.0.12+101.0.LTS
    - uses: actions/checkout@v7.0.1
      with:
        repository: yschimke/rc-players
        ref: 4083bc24425d802adc9b3440bd3ec12a3377fcd4
        path: .ci-dependencies/rc-players
        persist-credentials: false
    - uses: actions/setup-node@v6.5.0
      with:
        node-version: '22.23.3'
    - name: Build the matching browser player
      shell: bash
      working-directory: ${{ github.workspace }}/.ci-dependencies/rc-players/third_party/remote-compose-player
      run: |
        npm ci --ignore-scripts
        npm run bundle
    - name: Select the same source for Kotlin and browser consumers
      shell: bash
      env:
        PLAYER_SOURCE: ${{ github.workspace }}/.ci-dependencies/rc-players
      run: printf 'RC_PLAYERS_DIR=%s\n' "$PLAYER_SOURCE" >> "$GITHUB_ENV"
