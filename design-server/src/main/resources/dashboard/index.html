<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lovelace dashboard editor</title><style>
body{font:15px system-ui;margin:0;color:#202124;background:#f8fafb}header,section,nav{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}h1{font-size:21px;margin:0 16px 0 0}button,input,select{font:inherit;padding:7px}button{cursor:pointer}#status{padding:0 12px;min-height:24px}#editor{width:100%;height:72vh;border:0;background:white}textarea{width:98%;min-height:100px}details{margin:12px}label{display:inline-flex;gap:6px;align-items:center}#bindings{display:flex;gap:8px;flex-wrap:wrap}a{color:#0759a5}
</style></head><body>
<header><h1>Home Assistant dashboard</h1><button id="fixture">Open test dashboard</button><label>Import JSON<input id="file" type="file" accept=".json,application/json"></label><button id="export">Export JSON</button><button id="undo-edit">Undo edit</button></header>
<details><summary>Connect to your Home Assistant</summary><section><label>Home Assistant HTTPS URL <input id="hass" type="url" placeholder="https://my-home.example"></label><button id="connect">Connect</button><select id="dashboard" aria-label="Dashboard"></select><button id="load">Load dashboard</button><button id="save" disabled>Save to Home Assistant</button><button id="undo-save" disabled>Undo save</button></section><p>Sign in to load an existing dashboard. Imported files and the test dashboard are local drafts; use Export JSON to keep them.</p></details>
<section><label>Card style <select id="style"><option>classic</option><option>expressive</option><option>lcd</option><option>braun</option><option>trinitron</option><option>nixie</option><option>console</option></select></label><label><input id="dark" type="checkbox">Dark cards</label><a id="preview-login" target="_blank" rel="noopener" hidden>Sign in for real card previews</a><span id="preview-status" aria-live="polite"></span><label>Selected card entity <select id="entity" disabled></select></label><label>Grid columns <select id="columns" disabled></select></label><label>Grid rows <select id="rows" disabled></select></label></section>
<section><label>Template <select id="template"></select></label><label>Target view <select id="view"></select></label><div id="bindings"></div><button id="place">Place template</button><button id="capture-template">Export selected as template</button><label>Import template<input id="template-file" type="file" accept=".json,application/json"></label></section>
<p id="status" role="status" aria-live="polite">Open the test dashboard, import JSON, or connect to Home Assistant.</p>
<nav id="chrome" aria-label="Editor tools"></nav>
<iframe id="editor" title="Lovelace dashboard editor" src="/studio/dashboard/editor.html"></iframe>
<details><summary>Dashboard JSON</summary><textarea id="json" aria-label="Dashboard JSON" readonly></textarea></details>
<script type="module" src="/studio/dashboard/app.mjs"></script></body></html>
