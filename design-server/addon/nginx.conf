# The add-on's one door: Home Assistant ingress (and the Terrazzo integration's proxy) on 8099, split
# by path between the design server (:8080) and UI Builder (:8724) as ha.coo.ee's Caddy splits them
# (yschimke/preview-coo-ee deploy/image/ha.caddy).
#
# Ingress serves the add-on under a per-install prefix (/api/hassio_ingress/<token>), strips it before
# the request gets here, and names it in X-Ingress-Path. Neither server knows about prefixes, so
# everything they send back that names a path gets the prefix here: redirects, cookie paths, links in
# HTML and CSS. What their scripts fetch at run time, ingress.js prefixes in the browser.
#
# run.sh fills in @OPERATOR_TOKEN@ and @CORE_URL@.

# The Supervisor's ingress gateway, which only forwards a request once Home Assistant signed it in.
geo $from_ingress {
  default 0;
  172.30.32.2 1;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

# The host the browser used: ingress names it in X-Forwarded-Host. Both servers compare a POST's
# Origin with it.
map $http_x_forwarded_host $browser_host {
  "" $host;
  default $http_x_forwarded_host;
}

server {
  listen 8099;

  # Home Assistant's own network only. Ingress is trusted as it is. Anything else there (Core, which
  # runs on the host network, as do some add-ons) must show a Home Assistant access token Core
  # accepts: the Terrazzo integration's proxy forwards the app's. That sign-in is all that makes
  # X-Remote-User-Name (who they are) safe to rely on.
  allow 172.30.32.0/23;
  deny all;
  auth_request /__auth;

  location = /__auth {
    internal;
    if ($from_ingress) {
      return 204;
    }
    proxy_pass @CORE_URL@/api/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
  }

  client_max_body_size 32m;

  proxy_http_version 1.1;
  proxy_set_header Host $browser_host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  # sub_filter reads plain bodies only.
  proxy_set_header Accept-Encoding "";
  proxy_read_timeout 1h;
  proxy_buffering off;

  # Redirects stay relative: nginx would otherwise name its own address in them.
  absolute_redirect off;
  proxy_redirect / $http_x_ingress_path/;
  proxy_redirect http://$browser_host/ $http_x_ingress_path/;
  proxy_redirect https://$browser_host/ $http_x_ingress_path/;
  proxy_cookie_path / $http_x_ingress_path/;

  sub_filter_once off;
  sub_filter_types text/css;
  # First in <head>: the shim before any script runs, and the editor's page base under the prefix.
  sub_filter '<head>' '<head><script src="$http_x_ingress_path/__ingress.js"></script><meta name="ui-builder-base-path" content="$http_x_ingress_path/ui-builder/">';
  sub_filter 'href="/' 'href="$http_x_ingress_path/';
  sub_filter 'src="/' 'src="$http_x_ingress_path/';
  sub_filter 'action="/' 'action="$http_x_ingress_path/';
  sub_filter 'url(/' 'url($http_x_ingress_path/';
  # UI Builder's import map, which modules resolve bare imports through.
  sub_filter '"/ui-builder/' '"$http_x_ingress_path/ui-builder/';

  location = /__ingress.js {
    alias /etc/nginx/ingress.js;
    default_type application/javascript;
    # Revalidated on every page, so an updated add-on never runs an old shim.
    add_header Cache-Control "no-cache";
  }

  # The design server's paths (the same list as ha.caddy's @designs).
  location ~ ^/(demo|designs|site|schema|embed|studio|library|edit|healthz|my)(/|$) {
    proxy_pass http://127.0.0.1:8080;
  }
  location ~ ^/api/(designs|schema|cards/resolve|studio|library|my)(/|$) {
    proxy_pass http://127.0.0.1:8080;
  }
  location = / {
    proxy_pass http://127.0.0.1:8080;
  }

  # Everything else is UI Builder's, as its operator: everyone who reaches it here came through the
  # admin-only panel. A token holder (the app, through the integration) gets the design server's
  # API above and no more.
  location / {
    if ($from_ingress = 0) {
      return 403;
    }
    # A proxy_set_header here drops the server's, so they are all restated.
    proxy_set_header Host $browser_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Compose-Preview-Token "@OPERATOR_TOKEN@";
    proxy_pass http://127.0.0.1:8724;
  }
}
