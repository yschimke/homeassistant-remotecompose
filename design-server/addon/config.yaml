slug: card_designs
name: Terrazzo Card Designs
version: 0.1.99
description: >-
  Your own card design server and UI Builder, private to this Home Assistant.
  The Terrazzo app finds it through the Terrazzo integration and keeps your
  designs here instead of ha.coo.ee.
url: >-
  https://github.com/yschimke/homeassistant-remotecompose/tree/main/design-server/addon
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_entry: /designs
panel_icon: mdi:palette-swatch-variant
panel_title: Terrazzo Card Designs
panel_admin: true
hassio_api: true
options: {}
schema: {}
# Pulled, not built on the box: release-build.yml publishes the add-on image for each release
# version. The Supervisor substitutes {arch}.
image: ghcr.io/yschimke/ha-card-designs-{arch}
