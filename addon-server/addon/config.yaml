# Home Assistant add-on manifest. Lives in the directory the user adds as a
# local add-on repo, or that we publish via the GitHub Pages add-on store.
#
# Reference: https://developers.home-assistant.io/docs/add-ons/configuration/

slug: remotecompose
name: RemoteCompose Dashboards
version: "0.1.0"
description: >-
  Serves Home Assistant Lovelace dashboards as RemoteCompose documents over
  HTTP/WebSocket, with live state updates pushed to native clients (phone,
  Wear, TV, Glance widgets, ESP32).
url: https://github.com/yschimke/homeassistant-remotecompose
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false

# homeassistant_api: SUPERVISOR_TOKEN may use Core's API through the
# supervisor proxy — the bridge's `ws://supervisor/core/websocket` session.
homeassistant_api: true
# hassio_api: `GET http://supervisor/core/info` (default role), to find
# Core's port on the internal network. Direct-port callers' tokens are
# validated against Core there, because the supervisor's /core proxy only
# accepts add-on tokens. `auth_api` is not requested: that is the
# username/password `/auth` endpoint, which bearer-token auth doesn't use.
hassio_api: true

# Ingress lets users open the add-on through HA's authenticated proxy.
# Requests from the ingress gateway (172.30.32.2) are trusted; every other
# request — including the optional direct port below — needs
# `Authorization: Bearer <HA access token>`.
ingress: true
ingress_port: 8099
panel_icon: mdi:remote
panel_title: RemoteCompose

# Optional LAN exposure for native apps that aren't going through the HA
# frontend (Glance widgets, Wear tiles, ESP32). Off by default.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: RemoteCompose API (HTTP + WebSocket)

options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error|fatal)

# Multi-arch image lives in GHCR. The supervisor substitutes {arch}.
image: ghcr.io/yschimke/ha-remotecompose-{arch}
