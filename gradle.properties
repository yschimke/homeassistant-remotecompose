# 6g rather than 4g for D8. `connectedDebugAndroidTest` merges the androidTest
# dex archives of a dozen modules, and `DexMergingWorkAction` runs them in the
# Gradle JVM with no isolation, so several large merges are live at once. At
# 4g that OOM'd on `:rc-card-shutter:mergeExtDexDebugAndroidTest` once the
# compose-ai-tools artifacts grew (1.47.0 -> 1.71.0):
#   DexArchiveMergerException: Error while merging dex archives
#     Caused by: java.lang.OutOfMemoryError: Java heap space
# The runner has 16g and the emulator takes ~4g of it, so 6g still leaves room.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
# Metro RC4's compiler plugin is compiled for Java 21. Keep Kotlin compiler plugin loading inside
# the Gradle daemon JVM selected by gradle/gradle-daemon-jvm.properties instead of a stale Java 17
# Kotlin daemon.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

androidchka.agpVersion=9.2.1

# The Terrazzo catalog renders with downloadable Google Fonts. compose-preview
# 0.17.x fails the render when a requested face falls back instead of resolving;
# two of the catalog previews currently fall back (e.g. non-shipped weights of an
# Atkinson Hyperlegible face). Surface those as warnings (written to the render's
# warnings sidecar) rather than hard-failing every render, until the affected
# previews' faces are corrected. Strict fail-on-fallback stays the default upstream.
composePreview.fontsFailOnFallback=false
